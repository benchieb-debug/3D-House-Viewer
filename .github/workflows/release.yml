name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build integration ZIP
        run: |
          cd custom_components/house3d_viewer
          zip -r "$GITHUB_WORKSPACE/house3d_viewer.zip" . -x "*/__pycache__/*" "*.pyc"

      - name: Upload ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" house3d_viewer.zip --clobber
